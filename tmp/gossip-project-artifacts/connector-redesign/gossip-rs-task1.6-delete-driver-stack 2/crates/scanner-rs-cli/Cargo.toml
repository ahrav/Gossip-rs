[package]
name = "scanner-rs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Standalone scanner CLI wired through gossip-scanner-runtime"

[features]
default = []
aegis-pure-rust = ["gossip-scanner-runtime/aegis-pure-rust"]

[dependencies]
gossip-scanner-runtime.workspace = true

[[bin]]
name = "scanner-rs"
path = "src/main.rs"
