[package]
name = "scanner-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
base64 = "0.22"
memchr = "2"
regex = { version = "1", features = ["std"] }
tempfile = "3"
scanner-engine = { path = "..", features = ["tiger-harness", "test-support"] }

[[bin]]
name = "fuzz_anchor_soundness"
path = "fuzz_targets/fuzz_anchor_soundness.rs"
doc = false

[[bin]]
name = "fuzz_b64_gate_build_and_scan"
path = "fuzz_targets/fuzz_b64_gate_build_and_scan.rs"
doc = false

[[bin]]
name = "fuzz_b64_gate_determinism"
path = "fuzz_targets/fuzz_b64_gate_determinism.rs"
doc = false

[[bin]]
name = "fuzz_b64_gate_differential"
path = "fuzz_targets/fuzz_b64_gate_differential.rs"
doc = false

[[bin]]
name = "fuzz_dotenv_extract"
path = "fuzz_targets/fuzz_dotenv_extract.rs"
doc = false

[[bin]]
name = "fuzz_hit_pool_callback"
path = "fuzz_targets/fuzz_hit_pool_callback.rs"
doc = false

[[bin]]
name = "fuzz_java_class_extract"
path = "fuzz_targets/fuzz_java_class_extract.rs"
doc = false

[[bin]]
name = "fuzz_offline_validators"
path = "fuzz_targets/fuzz_offline_validators.rs"
doc = false

[[bin]]
name = "fuzz_pyc_extract"
path = "fuzz_targets/fuzz_pyc_extract.rs"
doc = false

[[bin]]
name = "fuzz_simd_classify"
path = "fuzz_targets/fuzz_simd_classify.rs"
doc = false

[[bin]]
name = "fuzz_tiger_chunking"
path = "fuzz_targets/fuzz_tiger_chunking.rs"
doc = false

[[bin]]
name = "fuzz_vs_cache_load"
path = "fuzz_targets/fuzz_vs_cache_load.rs"
doc = false

[workspace]
