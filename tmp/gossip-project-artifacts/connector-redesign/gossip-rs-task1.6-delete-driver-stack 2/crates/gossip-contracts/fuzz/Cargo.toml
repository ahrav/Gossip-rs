[package]
name = "gossip-contracts-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.gossip-contracts]
path = ".."
features = ["test-support"]

[[bin]]
name = "fuzz_item_identity_key"
path = "fuzz_targets/fuzz_item_identity_key.rs"
doc = false

[[bin]]
name = "fuzz_derivation_chain"
path = "fuzz_targets/fuzz_derivation_chain.rs"
doc = false

[workspace]
