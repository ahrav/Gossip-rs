[package]
name = "gossip-coordination-etcd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "etcd-backed coordination backend and record codec for gossip-rs"

[features]
default = []
test-support = ["gossip-coordination/test-support", "gossip-contracts/test-support"]

[dependencies]
gossip-coordination.workspace = true
gossip-contracts.workspace = true
gossip-stdx.workspace = true
etcd-client = "0.14"
tokio = { version = "1.44", features = ["rt", "time", "sync", "net"] }

[dev-dependencies]
gossip-coordination = { workspace = true, features = ["test-support"] }
gossip-contracts = { workspace = true, features = ["test-support"] }

[[test]]
name = "etcd_conformance"
path = "tests/etcd_conformance.rs"
required-features = ["test-support"]
