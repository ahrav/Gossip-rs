[package]
name = "eval-harness"
version = "0.1.0"
edition = "2024"
publish = false

# Intentionally standalone — not a workspace member of the root crate.
# Prevent cargo from walking up and claiming this as part of a parent workspace.
[workspace]
members = ["."]

[dependencies]
blake3 = "1.5"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
memchr = "2"
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# gossip-rs crates (path deps — eval-harness lives outside the workspace)
gossip-stdx = { path = "../../crates/gossip-stdx" }
scanner-engine = { path = "../../crates/scanner-engine", features = ["test-support"] }
scanner-scheduler = { path = "../../crates/scanner-scheduler" }
scanner-git = { path = "../../crates/scanner-git" }

[dev-dependencies]
proptest = "1.5"
rstest = "0.24"
tempfile = "3"
