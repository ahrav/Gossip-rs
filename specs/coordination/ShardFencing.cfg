\* ShardFencing.cfg -- Safety model config (final, no CONSTRAINT)
\*
\* 3 workers, 3 shards. SYMMETRY on workers only (shards are asymmetric
\* because parent has a distinguished role in SplitReplace).
\*
\* Per tla-spec skill section 3.3: SYMMETRY is sound for safety checking
\* when the symmetry set is correct. Workers are fully interchangeable.

SPECIFICATION SafetySpec

\* Constants
CONSTANT parent = parent
CONSTANT child1 = child1
CONSTANT child2 = child2
CONSTANT none = none

CONSTANT Workers = {w1, w2, w3}
CONSTANT AllShards = {parent, child1, child2}
CONSTANT MaxEpoch = 3
CONSTANT MaxCursor = 2
CONSTANT MaxTime = 6
CONSTANT LeaseDuration = 2

\* Symmetry: workers are interchangeable (6x state reduction)
\* Shards are NOT symmetric (parent/child asymmetry)
SYMMETRY WorkerSymmetry

\* Type invariant first, then safety properties
INVARIANT TypeOK
INVARIANT MutualExclusion
INVARIANT ZombieRejection
INVARIANT SplitAtomicity
INVARIANT ChildImpliesParentSplit
INVARIANT TerminalUnleased
INVARIANT FenceEpochSanity
INVARIANT CursorMonotonicity

\* Action properties (named temporal wrappers)
PROPERTY AlwaysFenceMonotonicity
PROPERTY AlwaysTerminalIrreversibility
PROPERTY AlwaysCursorNonRegression
