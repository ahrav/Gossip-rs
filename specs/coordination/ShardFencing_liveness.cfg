\* ShardFencing_liveness.cfg -- Liveness model config
\*
\* Smaller model for liveness (2 workers, 3 shards).
\* Per tla-spec skill section 4.2:
\*   - NO SYMMETRY (DANGEROUS with liveness)
\*   - NO CONSTRAINT (UNSOUND with liveness)
\*   - Uses LiveSpec (WF on Acquire only; NO WF on Tick)
\*   - Use -lncheck final flag

SPECIFICATION LiveSpec

\* Constants
CONSTANT parent = parent
CONSTANT child1 = child1
CONSTANT child2 = child2
CONSTANT none = none

CONSTANT Workers = {w1, w2}
CONSTANT AllShards = {parent, child1, child2}
CONSTANT MaxEpoch = 4
CONSTANT MaxCursor = 1
CONSTANT MaxTime = 8
CONSTANT LeaseDuration = 2

\* NO SYMMETRY -- incompatible with liveness checking
\* NO CONSTRAINT -- unsound with liveness checking

\* Keep safety invariants active alongside liveness
INVARIANT TypeOK
INVARIANT MutualExclusion

\* Liveness property
PROPERTY Liveness
