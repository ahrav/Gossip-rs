  anchors:
  - a3-
  - A3-
  radius: 256
  must_contain: null
  keywords_any:
  - a3-
  - A3-
  entropy:
    min_bits_per_byte: 3.8
    min_len: 16
    max_len: 256
  two_phase: null
  local_context: null
  secret_group: null
- name: '1password-service-account-token'
