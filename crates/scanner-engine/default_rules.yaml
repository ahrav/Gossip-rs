# ==========================================================================
# Default detection rules for scanner-rs.
#
# Each entry defines a secret-detection rule compiled into the scan engine.
# See docs/detection-rules.md for the full schema reference and authoring
# guidelines, and src/rules/yaml.rs for the parser.
#
# Required fields:
#   name      — Unique rule identifier (e.g. "github-pat").
#   regex     — Pattern compiled into a regex::bytes::Regex.
#   anchors   — Literal byte strings for Vectorscan pre-filter.
#   radius    — Byte radius around an anchor match fed to the regex.
#
# Optional fields:
#   must_contain           — Literal that must appear in the scan window.
#   keywords_any           — At least one keyword must appear near the match.
#   value_suppressors_any  — Substrings in extracted secret that suppress
#                            the finding (e.g. "EXAMPLE", "PLACEHOLDER").
#   entropy                — Shannon-entropy gate on extracted secret bytes.
#     min_bits_per_byte    — Minimum bits of Shannon entropy per byte.
#     min_entropy_bits_per_byte — Min-entropy (NIST SP 800-90B) floor;
#                                  see "Min-entropy gate" section below.
#     digit_penalty        — When true, subtract 1.2/log2(len) from Shannon
#                             for all-digit entropy slices.
#     min_len / max_len    — Length bounds for entropy measurement.
#   two_phase              — Two-pass scan: seed_radius → confirm_any → full_radius.
#   local_context          — Structural context checks (assignment, quoting, key names).
#   offline_validation     — Offline structural check (checksum, format) on extracted
#                            secret. See src/engine/offline_validate.rs for validators.
#     type                 — Algorithm: crc32_base62, github_fine_grained_pat,
#                            grafana_service_account, aws_access_key,
#                            sentry_org_token, pypi_token, slack_token.
#     prefix_skip          — (crc32_base62 only) Bytes to skip before payload.
#     payload_len          — (crc32_base62 only) Payload length in base-62 digits.
#     checksum_len         — (crc32_base62 only) Checksum length in base-62 digits.
#   secret_group           — Capture group index when the secret is not the full match.
#   uuid_format_secret     — When true, this rule captures UUID-format secrets;
#                            the UUID quick-reject filter is bypassed so findings
#                            with 8-4-4-4-12 hex values are kept.
#
# local_context sub-fields:
#   lookbehind / lookahead           — Byte window before/after the match.
#   require_same_line_assignment     — Secret must follow an assignment operator.
#   require_quoted                   — Secret must appear inside quotes.
#   key_names_any                    — At least one key name must appear nearby.
#
# Notes:
# - Unknown fields are silently ignored by the parser.
# - ValidatorKind is not expressible in YAML; it is set programmatically.
# - Rules are tested by `cargo test` (yaml.rs round-trip + integration tests).
#
# --------------------------------------------------------------------------
# Min-entropy gate (min_entropy_bits_per_byte)
#
# A second entropy check based on NIST SP 800-90B min-entropy [1]:
#
#     H_inf = log2(n) - log2(max_bin_count)
#
# Shannon entropy measures average information per byte; min-entropy
# measures worst-case predictability by focusing on the single most
# frequent byte value. By the Rényi entropy ordering theorem [2],
# H_inf <= H_Shannon always holds, with equality only for perfectly
# uniform distributions. This means min-entropy catches skewed byte
# distributions (repeated substrings, character-frequency bias) that
# pass Shannon checks — the gap grows with alphabet size, making this
# gate especially effective for alphanumeric (k=36) tokens.
#
# Implementation cost: near-zero. max_bin_count is already computed in the
# fused histogram pass (src/engine/helpers/entropy.rs). Adding this gate is
# 1 table lookup + 1 subtraction + 1 comparison (~5 ns), evaluated
# only for candidates that already pass Shannon (which rejects an
# estimated 80-90% first).
#
# Threshold: 2.0 bits/byte
#   Rejects strings where any single byte appears > n/4 times.
#   For alphabets k >= 16 at token lengths n >= 32, the false-rejection
#   probability for truly random tokens is negligible. At shorter lengths
#   (n < 20) with small alphabets (k = 16), birthday collisions make
#   the estimate unstable — such rules should not use this gate.
#
# Coverage tiers (97 rules with min-entropy gate):
#
#   Tier 0 (43 rules, original) — Hex-alphabet rules ([a-f0-9] patterns).
#     Small alphabet (k=16) where single-character repetition is the
#     dominant false-positive pattern.
#
#   Tier 1 (48 rules, added) — Keyword + alphanumeric, no checksum.
#     Highest FP-risk category: match `keyword + [a-z0-9]{N}` with no
#     prefix or checksum defense. Min-entropy provides a complementary
#     statistical gate alongside Shannon and value suppressors.
#
#   Tier 2 (6 rules, added) — Prefix-structured alphanumeric, no checksum.
#     Known prefix (e.g. "CLOJARS_", "lin_api_") but no checksum
#     validator. Min-entropy adds a secondary defense layer.
#
# Rules excluded from min-entropy (and why):
#   - Short hex (n<=17, k=16)   sidekiq-secret, sidekiq-sensitive-url.
#                                At n=17, P(max_count >= 5) ~ 3.7% for
#                                uniformly random tokens -- unacceptable FN.
#   - entropy: null             Structural patterns, not random tokens.
#   - offline_validation        Checksum already validates authenticity.
#   - Numeric-only (k=10)       Alphabet too small; threshold 2.0 too
#                                restrictive for base-10 tokens.
#   - Intentional low-entropy   Tokens with fixed segments like
#                                "AAAAAAAAAA" or "A{22}" by design.
#   - Base64 / structured       Non-uniform byte distribution by design;
#                                padding and encoding skew min-entropy.
#   - High Shannon (>= 4.0)     Shannon already filters effectively.
#   - Very short (< 20 chars)   Insufficient length for stable estimate.
#
# References:
#   [1] NIST SP 800-90B §6.3, "Recommendation for the Entropy Sources
#       Used for Random Bit Generation" (2018).
#   [2] Rényi, A. "On Measures of Entropy and Information," Proc. 4th
#       Berkeley Symposium on Math. Stat. and Prob. (1961), pp. 547-561.
# --------------------------------------------------------------------------
# ==========================================================================
