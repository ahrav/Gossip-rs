[package]
name = "scanner-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Standalone scanner detection engine extracted from scanner-rs"
autobenches = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)', 'cfg(miri)'] }

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[dependencies]
aegis = "0.9"
ahash = "0.8"
base64 = "0.22"
blake3 = "1.5"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1.4"
gossip-stdx.workspace = true
libc = "0.2"
memchr = "2.8"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9.42"
vectorscan-rs-sys = "0.0.5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[features]
default = []
kani = []
stdx-proptest = []
kgram-gate = []
perf-stats = []
stats = ["perf-stats"]
b64-stats = ["stats"]
bench = []
tiger-harness = []
sim-harness = ["perf-stats"]
perf-counters = ["perf-stats"]
test-support = []
aegis-pure-rust = ["aegis/pure-rust"]  # Use pure-Rust AEGIS on machines without SHA3 NEON (clang < 14)

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
gossip-stdx = { workspace = true, features = ["stdx-proptest"] }
proptest = "1.10"
rstest = "0.25"
tempfile = "3.10"

[[bench]]
name = "anchor_optimization"
harness = false
required-features = ["test-support"]

[[bench]]
name = "hit_pool"
harness = false
required-features = ["bench"]

[[bench]]
name = "offline_validation"
harness = false
required-features = ["bench"]

[[bench]]
name = "rule_isolation"
harness = false
required-features = ["test-support"]

[[bench]]
name = "rule_scaling"
harness = false
required-features = ["test-support"]

[[bench]]
name = "scan"
harness = false
required-features = ["test-support"]

[[bench]]
name = "scanner_throughput"
harness = false
required-features = ["test-support"]

[[bench]]
name = "set_associative_cache"
harness = false

[[bench]]
name = "simd_classify"
harness = false
required-features = ["bench"]

[[bench]]
name = "throughput_comparison"
harness = false
required-features = ["test-support"]

[[bench]]
name = "transform_decode"
harness = false
required-features = ["bench"]

[[bench]]
name = "validator"
harness = false

[[bench]]
name = "vectorscan_overhead"
harness = false
required-features = ["test-support"]

[[bench]]
name = "vectorscan_pattern_complexity"
harness = false
required-features = ["test-support"]

[[bench]]
name = "memory_bandwidth"
harness = false

[[bench]]
name = "oid_hash_quality"
harness = false

[[bench]]
name = "regex_complexity"
harness = false

[[bench]]
name = "runner_exec_contention"
harness = false
