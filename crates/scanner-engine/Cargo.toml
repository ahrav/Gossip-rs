[package]
name = "scanner-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Standalone scanner detection engine extracted from scanner-rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)', 'cfg(miri)'] }

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[dependencies]
aegis = "0.9"
ahash = "0.8"
base64 = "0.22"
blake3 = "1.5"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1.4"
gossip-stdx.workspace = true
libc = "0.2"
memchr = "2.8"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9.42"
vectorscan-rs-sys = "0.0.5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[features]
default = []
stdx-proptest = []
kgram-gate = []
perf-stats = []
stats = ["perf-stats"]
b64-stats = ["stats"]
bench = []
tiger-harness = []
sim-harness = ["perf-stats"]
perf-counters = ["perf-stats"]
test-support = []

[dev-dependencies]
proptest = "1.10"
rstest = "0.25"
tempfile = "3.10"
