[package]
name = "gossip-scanner-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Runtime orchestration APIs for scanner-rs direct and connector execution modes"

[features]
default = []
test-support = ["gossip-stdx/git-test-support"]
aegis-pure-rust = [
    "scanner-engine/aegis-pure-rust",
    "scanner-scheduler/aegis-pure-rust",
    "scanner-git/aegis-pure-rust",
]

[dependencies]
ahash.workspace = true
anyhow.workspace = true
fastbloom.workspace = true
gossip-coordination.workspace = true
gossip-connectors.workspace = true
gossip-contracts.workspace = true
gossip-frontier.workspace = true
gossip-orchestrator.workspace = true
gossip-stdx.workspace = true
scanner-engine.workspace = true
scanner-scheduler.workspace = true
scanner-git.workspace = true
regex = "1.12"
serde_json = "1"
thiserror = { workspace = true }
tracing.workspace = true

[dev-dependencies]
gossip-persistence-inmemory.workspace = true
gossip-stdx = { workspace = true, features = ["git-test-support"] }
proptest.workspace = true
rstest.workspace = true
scanner-git = { workspace = true, features = ["bench"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
