[package]
name = "gossip-stdx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
gossip-stdx = { path = ".." }

[[bin]]
name = "fuzz_ring_buffer"
path = "fuzz_targets/fuzz_ring_buffer.rs"
doc = false
