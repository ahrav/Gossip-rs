[package]
name = "gossip-coordination-etcd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "etcd-backed coordination backend for gossip-coordination"

[features]
default = []
tls = ["etcd-client/tls"]
test-support = ["gossip-coordination/test-support", "gossip-contracts/test-support"]

[dependencies]
gossip-coordination.workspace = true
gossip-contracts.workspace = true
gossip-stdx.workspace = true
etcd-client = { version = "0.18", default-features = false }
tokio = { version = "1", features = ["rt", "time", "sync", "net"] }
tracing.workspace = true

[dev-dependencies]
gossip-coordination = { workspace = true, features = ["test-support"] }
gossip-contracts = { workspace = true, features = ["test-support"] }
rstest.workspace = true
proptest.workspace = true
testcontainers.workspace = true
