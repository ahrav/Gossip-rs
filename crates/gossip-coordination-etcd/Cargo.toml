[package]
name = "gossip-coordination-etcd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "etcd-backed coordination backend for gossip-coordination"

[features]
default = []
tls = ["etcd-client/tls"]
test-support = [
    "gossip-coordination/test-support",
    "gossip-contracts/test-support",
    "etcd-client/pub-response-field",
    "etcd-client/build-server",
    "dep:rand",
    "dep:rand_chacha",
    "dep:testcontainers",
]

[dependencies]
gossip-coordination.workspace = true
gossip-contracts.workspace = true
gossip-stdx.workspace = true
etcd-client = { version = "0.18", default-features = false }
tokio = { version = "1", features = ["rt", "time", "sync", "net"] }
tracing.workspace = true
rand = { version = "0.9", optional = true }
rand_chacha = { version = "0.9", optional = true }
testcontainers = { workspace = true, optional = true }

[dev-dependencies]
gossip-coordination = { workspace = true, features = ["test-support"] }
gossip-contracts = { workspace = true, features = ["test-support"] }
etcd-client = { version = "0.18", default-features = false, features = ["pub-response-field", "build-server"] }
rstest.workspace = true
proptest.workspace = true
testcontainers.workspace = true
rand = "0.9"
rand_chacha = "0.9"
