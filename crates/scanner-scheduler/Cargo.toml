[package]
name = "scanner-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Scheduler and parallel scan runtime extracted from scanner-rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)', 'cfg(miri)'] }

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[dependencies]
scanner-engine.workspace = true
gossip-stdx.workspace = true
bzip2 = "0.5"
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-ng"] }
ignore = "0.4"
libc = "0.2"
memchr = "2.8"
num_cpus = "1.16"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"

[features]
default = []
perf-stats = ["scanner-engine/perf-stats"]
stats = ["perf-stats", "scanner-engine/stats"]
b64-stats = ["stats", "scanner-engine/b64-stats"]
bench = []
connector-pipeline = []
scheduler-sim = []
sim-harness = ["perf-stats"]
stdx-proptest = []

[dev-dependencies]
gossip-connectors.workspace = true
gossip-contracts = { workspace = true, features = ["test-support"] }
proptest = "1.10"
rstest = "0.25"
tempfile = "3.10"
