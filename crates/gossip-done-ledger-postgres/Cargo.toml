[package]
name = "gossip-done-ledger-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "PostgreSQL done-ledger backend and migrations for gossip-rs"

[lib]

[features]
## Exposes plaintext NoTls convenience helpers: `connect_and_apply_migrations`,
## `DoneLedgerPg::connect`, and `DoneLedgerPg::connect_and_migrate`.
## Enable in integration tests and local dev only — production callers should
## construct their own `Client` with TLS and use `DoneLedgerPg::from_client`.
test-utils = []

[dependencies]
gossip-contracts.workspace = true
gossip-pg-common.workspace = true
postgres.workspace = true
blake3 = "1.8"

[dev-dependencies]
proptest.workspace = true
gossip-contracts = { workspace = true, features = ["test-support"] }
gossip-stdx = { workspace = true, features = ["stdx-proptest"] }
gossip-pg-common = { workspace = true, features = ["test-support"] }
