[package]
name = "gossip-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Shared types, encodings, and invariants for gossip-rs"

[lib]

[features]
default = []
test-support = ["dep:rand", "dep:rand_chacha"]

[dependencies]
blake3 = "1.8"
subtle = "2.6"
rand = { version = "0.9", optional = true }
rand_chacha = { version = "0.9", optional = true }

[dev-dependencies]
proptest = "1.10"
rstest = "0.25"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.9"
rand_chacha = "0.9"

[[bench]]
name = "identity"
harness = false

[[bench]]
name = "sim"
harness = false
required-features = ["test-support"]
