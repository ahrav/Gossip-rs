[package]
name = "gossip-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Shared types, encodings, and invariants for gossip-rs"

[lib]

[features]
default = []
test-support = ["dep:proptest"]

[dependencies]
gossip-stdx = { workspace = true }
blake3 = "1.8"
subtle = "2.6"
proptest = { version = "1.10", optional = true }

[dev-dependencies]
gossip-stdx = { workspace = true, features = ["stdx-proptest"] }
proptest = "1.10"
rstest = "0.25"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "identity"
harness = false
