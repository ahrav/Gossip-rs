[package]
name = "gossip-persistence-inmemory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "In-memory reference persistence backends for gossip-rs tests and simulation"

[features]
default = []
test-support = ["gossip-contracts/test-support", "dep:rand", "dep:rand_chacha"]

[lib]

[dependencies]
gossip-contracts = { workspace = true }
rand = { version = "0.9", optional = true }
rand_chacha = { version = "0.9", optional = true }

[dev-dependencies]
gossip-contracts = { workspace = true, features = ["test-support"] }
gossip-done-ledger-postgres = { workspace = true, features = ["test-utils"] }
gossip-pg-common = { workspace = true, features = ["test-support"] }
proptest.workspace = true
postgres = "0.19"
rand = "0.9"
rand_chacha = "0.9"
