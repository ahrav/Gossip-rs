[package]
name = "gossip-coordination"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Coordination protocol: traits, state machine, InMemoryCoordinator, sim harness"

[features]
default = []
test-support = ["gossip-contracts/test-support", "dep:rand", "dep:rand_chacha", "dep:proptest", "dep:gossip-persistence-inmemory"]

[dependencies]
gossip-contracts.workspace = true
gossip-stdx.workspace = true
thiserror.workspace = true
ahash = "0.8"
blake3 = "1.8"
rand = { version = "0.9", optional = true }
rand_chacha = { version = "0.9", optional = true }
proptest = { version = "1.10", optional = true }
gossip-persistence-inmemory = { workspace = true, optional = true, features = ["test-support"] }

[dev-dependencies]
gossip-contracts = { workspace = true, features = ["test-support"] }
gossip-persistence-inmemory = { workspace = true, features = ["test-support"] }
proptest = "1.10"
rstest = "0.25"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.9"
rand_chacha = "0.9"

[[bench]]
name = "coordination"
harness = false
required-features = ["test-support"]

[[bench]]
name = "sim"
harness = false
required-features = ["test-support"]
