[package]
name = "gossip-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Source connectors: filesystem, git, SaaS integrations"

[features]
default = []
aegis-pure-rust = ["scanner-engine/aegis-pure-rust"]

[dependencies]
anyhow.workspace = true
gossip-contracts.workspace = true
gossip-scan-driver.workspace = true
gossip-stdx.workspace = true
scanner-engine.workspace = true
scanner-git.workspace = true
scanner-scheduler.workspace = true
crossbeam-channel = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gossip-contracts = { workspace = true, features = ["test-support"] }
gossip-stdx = { workspace = true, features = ["stdx-proptest"] }
proptest = "1.10"
rstest = "0.25"
tempfile = "3"
