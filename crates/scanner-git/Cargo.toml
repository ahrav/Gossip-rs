[package]
name = "scanner-git"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Git scanning pipeline extracted from scanner-rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)', 'cfg(miri)'] }

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[dependencies]
scanner-engine = { workspace = true, features = ["test-support"] }
scanner-scheduler.workspace = true
gossip-stdx.workspace = true
ahash = "0.8"
blake3 = "1.5"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1.4"
flate2 = { version = "1.1", default-features = false, features = ["zlib-ng"] }
gix-commitgraph = "0.34"
gix-hash = { version = "0.22", features = ["sha256"] }
gix-ref = "0.60"
libc = "0.2"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
rocksdb = { version = "0.24", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9.42"
sha2 = "0.10"

[features]
default = []
kani = []
perf-stats = []
stats = ["perf-stats"]
git-perf = ["perf-stats", "scanner-engine/perf-counters"]
bench = []
rocksdb = ["dep:rocksdb"]
stdx-proptest = []
sim-harness = ["scanner-scheduler/sim-harness"]
aegis-pure-rust = ["scanner-engine/aegis-pure-rust"]

[dev-dependencies]
criterion = "0.5"
gossip-stdx = { workspace = true, features = ["stdx-proptest"] }
proptest = "1.10"
rstest = "0.25"
scanner-engine = { workspace = true, features = ["test-support"] }
scanner-scheduler.workspace = true
sha1 = "0.10"
tempfile = "3.10"

[[bench]]
name = "commit_graph_generation"
harness = false

[[bench]]
name = "git_scan_parse"
harness = false

[[bench]]
name = "git_scan_perf"
harness = false

[[bench]]
name = "identity_enrichment"
harness = false

[[bench]]
name = "midx_build_scaling"
harness = false

[[bench]]
name = "object_store_iterative_delta"
harness = false
required-features = ["bench"]

[[bench]]
name = "pack_inflate_perf"
harness = false

[[bench]]
name = "path_policy"
harness = false

[[bench]]
name = "runner_exec_locality"
harness = false
required-features = ["bench"]

[[bench]]
name = "runner_exec_strategy"
harness = false
required-features = ["bench"]
