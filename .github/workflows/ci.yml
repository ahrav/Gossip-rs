name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.beads/**'
      - 'docs/**'
      - 'diagrams/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.beads/**'
      - 'docs/**'
      - 'diagrams/**'
      - '*.md'
      - 'LICENSE'
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # ── Path filtering — skip expensive jobs on docs-only PRs ──────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/**'

  # ── Format ─────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          components: rustfmt
      # No cache needed — fmt does not compile
      - run: cargo fmt --all -- --check

  # ── Lint ───────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
          shared-key: stable-linux

      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Test ───────────────────────────────────────────────────────────
  # PR/push: lightweight feature set — excludes stdx-proptest, sim-harness,
  # tiger-harness, kgram-gate, bench, b64-stats, perf-counters.
  # Those are exercised nightly by test-full-harness with --all-features.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      PROPTEST_CASES: "4"
      STRESS_ITERATIONS: "20"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d6e286fa45544157a02d45a43742857ebbc25d12 # v2.68.16
        with:
          tool: cargo-nextest

      - name: Build tests
        run: >-
          cargo nextest run
          --features test-support,perf-stats
          --no-run
          --profile ci

      - name: Run tests
        run: >-
          cargo nextest run
          --features test-support,perf-stats
          --profile ci

      # nextest does not run doctests; run them separately.
      - name: Run doctests
        run: >-
          cargo test
          --features test-support,perf-stats
          --doc

  # ── Benchmark (compile check) ────────────────────────────────────
  bench:
    name: Bench (compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - run: cargo bench --features test-support,bench,perf-stats --no-run

  # ── MSRV ──────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.93)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: "1.93"
      - run: cargo check --all-features

  # ── Docs ───────────────────────────────────────────────────────────
  doc:
    name: Doc
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - run: cargo doc --no-deps --all-features

  # ── Dependency Lint (licenses, advisories, bans) ───────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2
        with:
          command: check
          arguments: --all-features

  # ── Security Audit ─────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════
  # Scheduled-only jobs (nightly at 02:00 UTC)
  # ══════════════════════════════════════════════════════════════════

  # ── Test (full harness, nightly) ─────────────────────────────────
  # --all-features enables stdx-proptest, sim-harness, tiger-harness,
  # kgram-gate, b64-stats, perf-counters — everything the PR job skips.
  test-full-harness:
    name: Test (Scheduled, Full Harness)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROPTEST_CASES: "64"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d6e286fa45544157a02d45a43742857ebbc25d12 # v2.68.16
        with:
          tool: cargo-nextest

      - name: Run tests (debug)
        run: cargo nextest run --all-features --profile nightly
      - name: Run doctests (debug)
        run: cargo test --all-features --doc
      - name: Run tests (release)
        run: cargo nextest run --all-features --release --profile nightly
      - name: Run doctests (release)
        run: cargo test --all-features --release --doc

  # ── Miri (nightly only) ────────────────────────────────────────────
  miri:
    name: Miri (Scheduled, Nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: ""
      MIRIFLAGS: >-
        -Zmiri-strict-provenance
        -Zmiri-symbolic-alignment-check
        -Zmiri-preemption-rate=0.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: miri
          shared-key: nightly-linux-miri

      # Pure-Rust crates — run full test suites under Miri.
      - name: Miri — gossip-stdx
        run: cargo +nightly miri test -p gossip-stdx --all-features

      - name: Miri — gossip-contracts
        run: cargo +nightly miri test -p gossip-contracts --all-features

      - name: Miri — gossip-coordination
        run: cargo +nightly miri test -p gossip-coordination --all-features

      - name: Miri — gossip-frontier
        run: cargo +nightly miri test -p gossip-frontier --all-features

      # FFI-heavy crates — Miri interprets Rust but cannot execute C/asm.
      # Tests with FFI calls are gated behind #[cfg(not(miri))]; SIMD paths
      # have #[cfg(miri)] scalar fallbacks.  Use aegis-pure-rust to avoid
      # AES-NI / NEON intrinsics that Miri cannot interpret.
      - name: Miri — scanner-engine (pure-Rust paths)
        run: >-
          cargo +nightly miri test -p scanner-engine
          --features aegis-pure-rust,test-support

      - name: Miri — scanner-git
        run: cargo +nightly miri test -p scanner-git --features aegis-pure-rust

  # ── Kani (nightly only) ──────────────────────────────────────────────
  kani:
    name: Kani Verification (Scheduled)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Kani verifies all #[kani::proof] harnesses per crate.
      # 80 total proofs across 4 crates.
      - name: Kani — gossip-stdx (54 proofs)
        uses: model-checking/kani-github-action@v1.1
        with:
          args: --package gossip-stdx --features kani

      - name: Kani — scanner-engine (15 proofs)
        uses: model-checking/kani-github-action@v1.1
        with:
          args: --package scanner-engine --features kani

      - name: Kani — scanner-scheduler (9 proofs)
        uses: model-checking/kani-github-action@v1.1
        with:
          args: --package scanner-scheduler --features kani

      - name: Kani — scanner-git (2 proofs)
        uses: model-checking/kani-github-action@v1.1
        with:
          args: --package scanner-git --features kani

  # ── Loom (nightly only) ──────────────────────────────────────────────
  loom:
    name: Loom Concurrency (Scheduled)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      # Loom exhaustively explores thread interleavings.
      # 12 loom::model tests across 2 crates (gossip-stdx, scanner-scheduler).
      - name: Loom — gossip-stdx (8 tests)
        run: >-
          RUSTFLAGS="--cfg loom" cargo test --lib
          -p gossip-stdx -- loom_tests

      - name: Loom — scanner-scheduler (4 tests)
        run: >-
          RUSTFLAGS="--cfg loom" cargo test --lib
          -p scanner-scheduler -- loom_tests

  # ── ASAN (nightly only) ─────────────────────────────────────────────
  asan:
    name: ASAN (Scheduled, Nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rust-src
          shared-key: nightly-linux-asan

      # AddressSanitizer targets SIMD and offline validation modules in
      # scanner-engine where unsafe pointer arithmetic is concentrated.
      - name: ASAN — scanner-engine (simd_classify + offline_validate)
        run: >-
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly test
          -Zbuild-std --target x86_64-unknown-linux-gnu
          -p scanner-engine --lib
          -- engine::simd_classify engine::offline_validate

  # ── Nightly Summary ───────────────────────────────────────────────
  nightly-summary:
    name: Nightly Summary
    if: always() && github.event_name == 'schedule'
    needs: [test-full-harness, miri, kani, loom, asan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::One or more nightly jobs failed. Check the workflow run for details."
          exit 1
