name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.beads/**'
      - 'docs/**'
      - 'diagrams/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.beads/**'
      - 'docs/**'
      - 'diagrams/**'
      - '*.md'
      - 'LICENSE'
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # ── Path filtering — skip expensive jobs on docs-only PRs ──────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/**'

  # ── Format ─────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          components: rustfmt
      # No cache needed — fmt does not compile
      - run: cargo fmt --all -- --check

  # ── Lint ───────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
          shared-key: stable-linux

      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Test ───────────────────────────────────────────────────────────
  # PR/push: lightweight feature set — excludes stdx-proptest, sim-harness,
  # tiger-harness, kgram-gate, bench, b64-stats, perf-counters.
  # Those are exercised nightly by test-full-harness with --all-features.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      PROPTEST_CASES: "4"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - run: >-
          cargo test
          --features test-support,perf-stats

  # ── Benchmark (compile check) ────────────────────────────────────
  bench:
    name: Bench (compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - run: cargo bench --features test-support,bench,perf-stats --no-run

  # ── MSRV ──────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.93)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: "1.93"
      - run: cargo check --all-features

  # ── Docs ───────────────────────────────────────────────────────────
  doc:
    name: Doc
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - run: cargo doc --no-deps --all-features

  # ── Dependency Lint (licenses, advisories, bans) ───────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2
        with:
          command: check
          arguments: --all-features

  # ── Security Audit ─────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════
  # Scheduled-only jobs (nightly at 02:00 UTC)
  # ══════════════════════════════════════════════════════════════════

  # ── Test (full harness, nightly) ─────────────────────────────────
  # --all-features enables stdx-proptest, sim-harness, tiger-harness,
  # kgram-gate, b64-stats, perf-counters — everything the PR job skips.
  test-full-harness:
    name: Test (Scheduled, Full Harness)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROPTEST_CASES: "64"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - run: cargo test --all-features
      - run: cargo test --all-features --release

  # ── Miri (nightly only) ────────────────────────────────────────────
  miri:
    name: Miri (Scheduled, Nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: ""
      MIRIFLAGS: >-
        -Zmiri-strict-provenance
        -Zmiri-symbolic-alignment-check
        -Zmiri-preemption-rate=0.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: miri
          shared-key: nightly-linux-miri

      - run: cargo +nightly miri test -p gossip-stdx --all-features

  # ── Kani (nightly only) ──────────────────────────────────────────────
  kani:
    name: Kani Verification (Scheduled)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: model-checking/kani-github-action@v1.1
        with:
          args: --package gossip-stdx --features kani

  # ── Nightly Summary ───────────────────────────────────────────────
  nightly-summary:
    name: Nightly Summary
    if: always() && github.event_name == 'schedule'
    needs: [test-full-harness, miri, kani]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::One or more nightly jobs failed. Check the workflow run for details."
          exit 1
