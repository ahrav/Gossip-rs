name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # ── Path filtering — skip expensive jobs on docs-only PRs ──────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.non_pr.outputs.rust || steps.filter.outputs.rust }}
    steps:
      - name: Default to rust changes for non-PR events
        if: github.event_name != 'pull_request'
        id: non_pr
        run: echo "rust=true" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/**'

  # ── Format ─────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          components: rustfmt
      # No cache needed — fmt does not compile
      - run: cargo fmt --all -- --check

  # ── Lint ───────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    needs: [fmt]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
          shared-key: stable-linux

      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Test ───────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: [clippy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - run: cargo test --all-features

  # ── Docs ───────────────────────────────────────────────────────────
  doc:
    name: Doc
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
    needs: [changes]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - run: cargo doc --no-deps --all-features

  # ── Security Audit ─────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Miri (nightly only) ────────────────────────────────────────────
  miri:
    name: Miri
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    env:
      RUSTC_WRAPPER: ""
      MIRIFLAGS: >-
        -Zmiri-strict-provenance
        -Zmiri-symbolic-alignment-check
        -Zmiri-preemption-rate=0.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: miri
          shared-key: nightly-linux-miri

      - run: cargo +nightly miri test --all-features
