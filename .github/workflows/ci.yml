name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.beads/**'
      - 'docs/**'
      - 'diagrams/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.beads/**'
      - 'docs/**'
      - 'diagrams/**'
      - '*.md'
      - 'LICENSE'
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # ── Path filtering — skip expensive jobs on docs-only PRs ──────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/**'
            fuzz:
              - 'crates/*/fuzz/**'
              - 'crates/**/*.rs'
              - 'crates/**/Cargo.toml'

  # ── Format ─────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          components: rustfmt
      # No cache needed — fmt does not compile
      - run: cargo fmt --all -- --check

  # ── Lint ───────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
          shared-key: stable-linux

      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Lint (aarch64) ─────────────────────────────────────────────────
  clippy-aarch64:
    name: Clippy (aarch64)
    runs-on: macos-15
    timeout-minutes: 20
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
          shared-key: stable-macos

      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Test ───────────────────────────────────────────────────────────
  # PR/push: lightweight feature set — excludes stdx-proptest, sim-harness,
  # tiger-harness, kgram-gate, bench, b64-stats, perf-counters.
  # Those are exercised nightly by test-full-harness with --all-features.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      PROPTEST_CASES: "4"
      STRESS_ITERATIONS: "20"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d6e286fa45544157a02d45a43742857ebbc25d12 # v2.68.16
        with:
          tool: cargo-nextest

      - name: Build tests
        run: >-
          cargo nextest run
          --features test-support,perf-stats
          --no-run
          --profile ci

      - name: Run tests
        run: >-
          cargo nextest run
          --features test-support,perf-stats
          --profile ci

      # nextest does not run doctests; run them separately.
      - name: Run doctests
        run: >-
          cargo test
          --features test-support,perf-stats
          --doc

  # ── Test (aarch64) ─────────────────────────────────────────────────
  test-aarch64:
    name: Test (aarch64)
    runs-on: macos-15
    timeout-minutes: 30
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      PROPTEST_CASES: "4"
      STRESS_ITERATIONS: "20"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-macos
          save-cache: "false"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d6e286fa45544157a02d45a43742857ebbc25d12 # v2.68.16
        with:
          tool: cargo-nextest

      - name: Run tests
        run: >-
          cargo nextest run
          --features test-support,perf-stats
          --profile ci

      - name: Run doctests
        run: >-
          cargo test
          --features test-support,perf-stats
          --doc

  # ── Test (PostgreSQL integration) ─────────────────────────────────
  # Runs the #[ignore]d integration tests in gossip-done-ledger-postgres
  # against a real PostgreSQL service container. Bypasses testcontainers
  # by providing GOSSIP_POSTGRES_TEST_URL directly.
  test-postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      GOSSIP_POSTGRES_TEST_URL: "host=localhost port=5432 user=postgres password=postgres dbname=postgres"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d6e286fa45544157a02d45a43742857ebbc25d12 # v2.68.16
        with:
          tool: cargo-nextest

      - name: Run PostgreSQL integration tests
        run: >-
          cargo nextest run
          -p gossip-done-ledger-postgres
          --run-ignored ignored-only
          --profile ci

  # ── Benchmark (compile check) ────────────────────────────────────
  bench:
    name: Bench (compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux-bench
          save-cache: "true"

      - run: cargo bench --features test-support,bench,perf-stats --no-run

  # ── MSRV ──────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.93)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.93"
          shared-key: msrv-linux
      - run: cargo check --all-features

  # ── Docs ───────────────────────────────────────────────────────────
  doc:
    name: Doc
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux-doc
          save-cache: "true"

      - run: cargo doc --no-deps --all-features

  # ── Dependency Lint (licenses, advisories, bans) ───────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2
        with:
          command: check
          arguments: --all-features

  # ── Eval Harness ──────────────────────────────────────────────────
  # Separate workspace in tools/eval-harness/ — has its own Cargo.toml
  # and Cargo.lock, so fmt/clippy/test run independently.
  eval-harness:
    name: Eval Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: rustfmt, clippy
          shared-key: eval-harness-linux
          cache-workspaces: "tools/eval-harness -> target"

      - run: cargo fmt --check
        working-directory: tools/eval-harness
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: tools/eval-harness
      - run: cargo test
        working-directory: tools/eval-harness

  # ── Security Audit ─────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Fuzz Pack Smoke (PR only) ───────────────────────────────────────
  # Quick sanity check on the 4 pack-format fuzz targets when fuzz or
  # source files change in a PR. Each target runs for 20 seconds max.
  fuzz-pack-smoke:
    name: Fuzz Pack Smoke (PR)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && needs.changes.outputs.fuzz == 'true'
    needs: [changes]
    env:
      RUSTC_WRAPPER: ""
      FUZZ_SECONDS: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rust-src
          shared-key: nightly-linux-fuzz
          extra-apt: "clang llvm"
          cache-workspaces: "crates/scanner-git/fuzz -> target"

      - uses: ./.github/actions/setup-cargo-fuzz

      - name: Restore fuzz corpus cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: crates/scanner-git/fuzz/corpus
          key: fuzz-corpus-pack-${{ hashFiles('crates/scanner-git/fuzz/corpus/fuzz_pack_*/**') }}
          restore-keys: |
            fuzz-corpus-pack-

      - name: Run pack fuzz targets
        working-directory: crates/scanner-git/fuzz
        run: |
          cargo +nightly fuzz run fuzz_pack_parse_delta   --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_delta_into     --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_exec           --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}

  # ══════════════════════════════════════════════════════════════════
  # Scheduled-only jobs (nightly at 02:00 UTC)
  # ══════════════════════════════════════════════════════════════════

  # ── Test (full harness, nightly) ─────────────────────────────────
  # --all-features enables stdx-proptest, sim-harness, tiger-harness,
  # kgram-gate, b64-stats, perf-counters — everything the PR job skips.
  test-full-harness:
    name: Test (Scheduled, Full Harness)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PROPTEST_CASES: "64"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d6e286fa45544157a02d45a43742857ebbc25d12 # v2.68.16
        with:
          tool: cargo-nextest

      - name: Run tests (debug)
        run: cargo nextest run --all-features --profile nightly
      - name: Run doctests (debug)
        run: cargo test --all-features --doc
      - name: Run tests (release)
        run: cargo nextest run --all-features --release --profile nightly
      - name: Run doctests (release)
        run: cargo test --all-features --release --doc

  # ── Miri (nightly only) ────────────────────────────────────────────
  miri:
    name: Miri (Scheduled, Nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: ""
      MIRIFLAGS: >-
        -Zmiri-strict-provenance
        -Zmiri-symbolic-alignment-check
        -Zmiri-preemption-rate=0.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: miri
          shared-key: nightly-linux-miri

      # Pure-Rust crates — run full test suites under Miri.
      - name: Miri — gossip-stdx
        run: cargo +nightly miri test -p gossip-stdx --all-features

      - name: Miri — gossip-contracts
        run: cargo +nightly miri test -p gossip-contracts --all-features

      - name: Miri — gossip-coordination
        run: cargo +nightly miri test -p gossip-coordination --all-features

      - name: Miri — gossip-frontier
        run: cargo +nightly miri test -p gossip-frontier --all-features

      # FFI-heavy crates — Miri interprets Rust but cannot execute C/asm.
      # Most scanner-engine tests call Vectorscan FFI (via demo_engine /
      # cached_demo_engine → VsPrefilterDb::try_new → hs_compile_multi),
      # which Miri cannot interpret.  Only run modules with pure-Rust logic
      # and #[cfg(miri)] scalar fallbacks: simd_classify, offline_validate,
      # and set_associative_cache.  Use aegis-pure-rust to avoid AES-NI /
      # NEON intrinsics that Miri cannot interpret.
      - name: Miri — scanner-engine (pure-Rust paths)
        run: >-
          cargo +nightly miri test -p scanner-engine
          --features aegis-pure-rust,test-support
          -- simd_classify offline_validate set_associative_cache

      # scanner-git: all tests call Vectorscan FFI (via
      # demo_engine_with_anchor_mode); no miri-safe test modules exist yet.
      # TODO: add #[cfg(not(miri))] guards to engine_adapter_tests and
      # introduce miri-safe unit tests for pure-Rust logic.

  # ── Kani (nightly only) ──────────────────────────────────────────────
  kani:
    name: Kani Verification (Scheduled)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Kani verifies all #[kani::proof] harnesses per crate.
      # 80 total proofs across 4 crates.
      - name: Kani — gossip-stdx (54 proofs)
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          args: --package gossip-stdx --features kani

      - name: Kani — scanner-engine (15 proofs)
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          args: --package scanner-engine --features kani

      - name: Kani — scanner-scheduler (9 proofs)
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          args: --package scanner-scheduler --features kani

      - name: Kani — scanner-git (2 proofs)
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          args: --package scanner-git --features kani

  # ── Loom (concurrency model checking) ────────────────────────────────
  loom:
    name: Loom Concurrency (Scheduled)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      # Loom exhaustively explores thread interleavings.
      # 12 loom::model tests across 2 crates (gossip-stdx, scanner-scheduler).
      - name: Loom — gossip-stdx (8 tests)
        run: >-
          RUSTFLAGS="--cfg loom" cargo test --lib
          -p gossip-stdx --features loom -- loom_tests

      - name: Loom — scanner-scheduler (4 tests)
        run: >-
          RUSTFLAGS="--cfg loom" cargo test --lib
          -p scanner-scheduler --features loom -- loom_tests

  # ── ASAN (nightly only) ─────────────────────────────────────────────
  asan:
    name: ASAN (Scheduled, Nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rust-src
          shared-key: nightly-linux-asan

      # AddressSanitizer targets SIMD and offline validation modules in
      # scanner-engine where unsafe pointer arithmetic is concentrated.
      - name: ASAN — scanner-engine (simd_classify + offline_validate)
        run: >-
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly test
          -Zbuild-std --target x86_64-unknown-linux-gnu
          -p scanner-engine --lib
          -- engine::simd_classify engine::offline_validate

  # ── Fuzz (nightly, Linux) ─────────────────────────────────────────
  # Runs all fuzz targets across every crate with a fuzz/ directory.
  # Each target gets 10K iterations on x86_64-unknown-linux-gnu.
  fuzz-linux:
    name: Fuzz (Scheduled, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.event_name == 'schedule'
    env:
      RUSTC_WRAPPER: ""
      FUZZ_RUNS: 10000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rust-src
          shared-key: nightly-linux-fuzz
          extra-apt: "clang llvm"

      - uses: ./.github/actions/setup-cargo-fuzz

      - name: Restore fuzz corpus cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            crates/gossip-contracts/fuzz/corpus
            crates/gossip-coordination-etcd/fuzz/corpus
            crates/gossip-stdx/fuzz/corpus
            crates/scanner-engine/fuzz/corpus
            crates/scanner-git/fuzz/corpus
          key: fuzz-corpus-nightly-linux-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-nightly-linux-

      - name: Fuzz — gossip-contracts (2 targets)
        working-directory: crates/gossip-contracts/fuzz
        run: |
          cargo +nightly fuzz run fuzz_derivation_chain --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_item_identity_key --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}

      - name: Fuzz — gossip-coordination-etcd (4 targets)
        working-directory: crates/gossip-coordination-etcd/fuzz
        run: |
          cargo +nightly fuzz run fuzz_decode_run_record --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_decode_shard_record --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_round_trip_run_record --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_round_trip_shard_record --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}

      - name: Fuzz — gossip-stdx (6 targets)
        working-directory: crates/gossip-stdx/fuzz
        run: |
          cargo +nightly fuzz run fuzz_atomic_bitset --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_byte_slab --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_inline_vec --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_ring_buffer --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_spsc --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_timing_wheel --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}

      - name: Fuzz — scanner-engine (12 targets)
        working-directory: crates/scanner-engine/fuzz
        run: |
          cargo +nightly fuzz run fuzz_anchor_soundness --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_build_and_scan --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_determinism --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_differential --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_dotenv_extract --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_hit_pool_callback --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_java_class_extract --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_offline_validators --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pyc_extract --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_simd_classify --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_tiger_chunking --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_vs_cache_load --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}

      - name: Fuzz — scanner-git (4 targets)
        working-directory: crates/scanner-git/fuzz
        run: |
          cargo +nightly fuzz run fuzz_pack_delta_into --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_exec --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_parse_delta --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}

  # ── Fuzz (nightly, macOS) ───────────────────────────────────────────
  # Same targets as fuzz-linux on aarch64-apple-darwin to catch
  # platform-specific bugs (NEON vs SSE, endianness in pack parsing).
  #
  # No extra-brew for clang/llvm: Xcode on macos-15 ships Apple Clang
  # with full libFuzzer and AddressSanitizer support. On Linux the
  # system GCC lacks sanitizer integration, so we install clang+llvm
  # explicitly via extra-apt.
  fuzz-macos:
    name: Fuzz (Scheduled, macOS)
    runs-on: macos-15
    timeout-minutes: 90
    if: github.event_name == 'schedule'
    env:
      RUSTC_WRAPPER: ""
      FUZZ_RUNS: 10000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rust-src
          shared-key: nightly-macos-fuzz

      - uses: ./.github/actions/setup-cargo-fuzz

      - name: Restore fuzz corpus cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            crates/gossip-contracts/fuzz/corpus
            crates/gossip-coordination-etcd/fuzz/corpus
            crates/gossip-stdx/fuzz/corpus
            crates/scanner-engine/fuzz/corpus
            crates/scanner-git/fuzz/corpus
          key: fuzz-corpus-nightly-macos-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-nightly-macos-

      - name: Fuzz — gossip-contracts (2 targets)
        working-directory: crates/gossip-contracts/fuzz
        run: |
          cargo +nightly fuzz run fuzz_derivation_chain --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_item_identity_key --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}

      - name: Fuzz — gossip-coordination-etcd (4 targets)
        working-directory: crates/gossip-coordination-etcd/fuzz
        run: |
          cargo +nightly fuzz run fuzz_decode_run_record --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_decode_shard_record --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_round_trip_run_record --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_round_trip_shard_record --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}

      - name: Fuzz — gossip-stdx (6 targets)
        working-directory: crates/gossip-stdx/fuzz
        run: |
          cargo +nightly fuzz run fuzz_atomic_bitset --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_byte_slab --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_inline_vec --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_ring_buffer --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_spsc --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_timing_wheel --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}

      - name: Fuzz — scanner-engine (12 targets)
        working-directory: crates/scanner-engine/fuzz
        run: |
          cargo +nightly fuzz run fuzz_anchor_soundness --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_build_and_scan --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_determinism --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_differential --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_dotenv_extract --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_hit_pool_callback --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_java_class_extract --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_offline_validators --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pyc_extract --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_simd_classify --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_tiger_chunking --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_vs_cache_load --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}

      - name: Fuzz — scanner-git (4 targets)
        working-directory: crates/scanner-git/fuzz
        run: |
          cargo +nightly fuzz run fuzz_pack_delta_into --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_exec --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_parse_delta --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}

  # ── Nightly Summary ───────────────────────────────────────────────
  nightly-summary:
    name: Nightly Summary
    if: always() && github.event_name == 'schedule'
    needs: [test-full-harness, miri, kani, loom, asan, fuzz-linux, fuzz-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::One or more nightly jobs failed. Check the workflow run for details."
          exit 1
