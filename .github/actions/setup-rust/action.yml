name: "Setup Rust"
description: "Install Rust toolchain and configure caching for CI jobs"

inputs:
  toolchain:
    description: "Rust toolchain (stable or nightly)"
    required: false
    default: "stable"
  components:
    description: "Comma-separated Rust components (e.g. clippy, rustfmt, miri)"
    required: false
    default: ""
  shared-key:
    description: "Shared cache key for Swatinem/rust-cache"
    required: true
  save-cache:
    description: "Whether to save the cache (false for read-only consumers)"
    required: false
    default: "true"
  extra-apt:
    description: "Additional apt packages to install (space-separated)"
    required: false
    default: ""
  extra-brew:
    description: "Additional Homebrew packages to install (space-separated)"
    required: false
    default: ""
  cache-workspaces:
    description: "Workspaces for rust-cache (e.g. 'fuzz -> target')"
    required: false
    default: ""
  targets:
    description: "Additional rustup targets to install (e.g. x86_64-unknown-linux-musl)"
    required: false
    default: ""
  github-token:
    description: "GitHub token for downloading sccache binary from releases"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    # vectorscan-rs-sys (scanner-engine dep) requires Boost headers + cmake.
    # etcd-client compiles .proto files via prost-build, which needs protoc.
    - name: Install system deps (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        EXTRA_APT: ${{ inputs.extra-apt }}
      run: |
        set -euo pipefail
        base_packages=(libboost-dev protobuf-compiler)

        raw_input="${EXTRA_APT}"
        normalized_input="${raw_input//$'\n'/ }"
        normalized_input="${normalized_input//$'\t'/ }"
        if [[ -n "${normalized_input// /}" ]]; then
          read -r -a extra <<< "${normalized_input}"
          for package in "${extra[@]}"; do
            if [[ ! "${package}" =~ ^[A-Za-z0-9][A-Za-z0-9+.:-]*$ ]]; then
              echo "Invalid apt package token: '${package}'" >&2
              exit 1
            fi
          done
          base_packages+=("${extra[@]}")
        fi

        sudo apt-get update
        sudo apt-get install -y -- "${base_packages[@]}"

    # vectorscan-rs-sys requires Boost headers on macOS too.
    # etcd-client compiles .proto files via prost-build, which needs protoc.
    - name: Install system deps (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        EXTRA_BREW: ${{ inputs.extra-brew }}
      run: |
        set -euo pipefail
        base_packages=(boost protobuf)

        raw_input="${EXTRA_BREW}"
        normalized_input="${raw_input//$'\n'/ }"
        normalized_input="${normalized_input//$'\t'/ }"
        if [[ -n "${normalized_input// /}" ]]; then
          read -r -a extra <<< "${normalized_input}"
          for package in "${extra[@]}"; do
            if [[ ! "${package}" =~ ^[A-Za-z0-9][A-Za-z0-9+.@:-]*$ ]]; then
              echo "Invalid brew package token: '${package}'" >&2
              exit 1
            fi
          done
          base_packages+=("${extra[@]}")
        fi

        brew install "${base_packages[@]}"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Configure sccache startup timeout
      shell: bash
      run: |
        mkdir -p "$HOME/.config/sccache"
        printf 'server_startup_timeout_ms = 30000\n' > "$HOME/.config/sccache/config"
        echo "SCCACHE_CONF=$HOME/.config/sccache/config" >> "$GITHUB_ENV"

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
      with:
        version: "v0.14.0"
        token: ${{ inputs.github-token }}

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-cache }}
        cache-all-crates: "true"
        workspaces: ${{ inputs.cache-workspaces }}
